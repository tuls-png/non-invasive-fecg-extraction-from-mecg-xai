# ADFECGDB Dataset Configuration
# Overrides to BaseConfig for ADFECGDB
# 
# ADFECGDB characteristics:
# - Direct fetal ECG electrode available
# - Standard adult maternal heart rates
# - Shorter, controlled recordings
# - .edf.qrs annotations available

MATERNAL_HR_MIN: 55
MATERNAL_HR_MAX: 110
FETAL_HR_MIN: 100
FETAL_HR_MAX: 185
FETAL_HR_LOW: 100
FETAL_HR_HIGH: 185
FETAL_HR_CENTRE: 130
EKF_FETAL_HR_INIT: 150

# New roadmap controls for robustness and ablation
SQI_FUSION_ENABLED: true
PERIODICITY_SCORE_ENABLED: true
ADAPTIVE_FILTER_ENABLED: true
EKF_USE_RTS_DEFAULT: true


