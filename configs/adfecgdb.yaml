# ADFECGDB Dataset Configuration
# Overrides to BaseConfig for ADFECGDB
# 
# ADFECGDB characteristics:
# - Direct fetal ECG electrode available
# - Standard adult maternal heart rates
# - Shorter, controlled recordings
# - .edf.qrs annotations available

maternal_hr_min: 55
maternal_hr_max: 110
fetal_hr_min: 100
fetal_hr_max: 185
fetal_hr_low: 100
fetal_hr_high: 185
fetal_hr_centre: 130
ekf_fetal_hr_init: 150
wsvd_component_corr_thresh: 0.20   # was 0.30 — accept weaker maternal correlations
wsvd_channel_r2_min: 0.25          # was 0.35 — subtract from more channels
wsvd_max_energy_removal: 0.70      # was 0.70 — allow more maternal removal
maternal_ica2_corr_thresh: 0.25    # was 0.30 — exclude more maternal residual ICs in Path B
template_half_window_sec: 0.25