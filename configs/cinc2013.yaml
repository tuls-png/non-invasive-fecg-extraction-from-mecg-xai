# configs/cinc2013.yaml
# CinC 2013 Challenge Set A overrides
#
# CinC2013 characteristics:
# - Active labor recordings (same gestational stage as ADFECGDB)
# - 4 abdominal channels, 1000 Hz, 1-minute duration
# - Fetal QRS annotations in .fqrs (crowd-sourced, direct ECG reference)
# - No direct electrode in released data
# - Multiple recording sources — heterogeneous SNR

maternal_hr_min: 50
maternal_hr_max: 115
fetal_hr_min: 100
fetal_hr_max: 200
fetal_hr_low: 100
fetal_hr_high: 200
fetal_hr_centre: 130
ekf_fetal_hr_init: 140

# FIX 2: Lower WSVD thresholds to trigger cancellation on high-maternal-SNR recordings
wsvd_component_corr_thresh: 0.15
wsvd_channel_r2_min: 0.20

# FIX 4: Change BANDPASS_LOW to 5.0 Hz to match ADFECGDB (avoid baseline drift)
bandpass_low: 5.0

# FIX 6: Lower PT_THRESHOLD_FACTOR to recover weak fetal beats post-subtraction
pt_threshold_factor: 0.5

# ICA dual-contrast: run both logcosh and exp, pick whichever gives
# a better maternal IC score. Addresses CinC2013's wide quality range
# where no single contrast function works universally.
ica_dual_contrast: true

# ── Path selection fixes (bimodal F1 diagnosis) ───────────────────────────────
#
# [FIX-PATH-1] PATH_A_PREFERENCE is now used as a SCORE multiplier, not a
# peak-count ratio. Set to 1.0 here so path selection is a pure score
# comparison on CinC2013 (both paths produce near-equal beat counts on 60-second
# recordings, so the old peak-count comparison never favoured Path A).
# ADFECGDB retains the base.py default of 1.5, which gives Path A a mild
# advantage on long clean recordings where it genuinely tends to score slightly
# higher.
path_a_preference: 1.0

# [FIX-PATH-2] Confidence gate: when the chosen path's unified score is below
# this threshold, the result is flagged as low_confidence=True in the metadata
# CSV. Does NOT suppress output — the result is still computed and logged.
# Set to 0.05 based on data: the three degenerate failure cases (a07, a09, a60)
# all had score = 0.000 and should be flagged rather than silently trusted.
confidence_gate_threshold: 0.05

# [FIX-PATH-3] HR_SEP_MIN_BPM is used by _is_fetal_hr() for BOTH the maternal
# HR separation check AND the new half-harmonic guard. 15 bpm is the existing
# base.py value; retaining it here for the half-harmonic check (which uses the
# same threshold) means no net change for recordings where the maternal HR is
# well-separated from the fetal HR — the guard only activates when candidate
# fetal HR is suspiciously close to half the maternal HR.
hr_sep_min_bpm: 15