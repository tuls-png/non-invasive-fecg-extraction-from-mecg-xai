# configs/cinc2013.yaml
# CinC 2013 Challenge Set A overrides
#
# CinC2013 characteristics:
# - Active labor recordings (same gestational stage as ADFECGDB)
# - 4 abdominal channels, 1000 Hz, 1-minute duration
# - Fetal QRS annotations in .fqrs (crowd-sourced, direct ECG reference)
# - No direct electrode in released data
# - Multiple recording sources — heterogeneous SNR

maternal_hr_min: 50
maternal_hr_max: 115
fetal_hr_min: 100
fetal_hr_max: 200
fetal_hr_low: 100
fetal_hr_high: 200
fetal_hr_centre: 130
ekf_fetal_hr_init: 140

# WSVD: lower thresholds to trigger cancellation on high-maternal-SNR recordings
wsvd_component_corr_thresh: 0.15
wsvd_channel_r2_min: 0.20

# Bandpass: match ADFECGDB (avoid baseline drift artefacts)
bandpass_low: 5.0

# Pan-Tompkins: lower threshold to recover weak fetal beats post-subtraction
pt_threshold_factor: 0.5

# [FIX-CINC] Path selector: reduce Path A preference so the purity-weighted
# Path B score is not structurally disadvantaged on noisy recordings without
# a direct electrode. ADFECGDB keeps the default 1.5 (Path A is reliable there).
path_a_preference: 1.1

# [FIX-CINC] HR separation minimum: relax slightly for CinC2013 labor recordings
# where maternal HR can push into 100-115 BPM, shrinking the gap to fetal range.
hr_sep_min_bpm: 12