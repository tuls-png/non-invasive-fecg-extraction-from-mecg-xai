# configs/cinc2013.yaml
# CinC 2013 Challenge Set A overrides
#
# CinC2013 characteristics:
# - Active labor recordings (same gestational stage as ADFECGDB)
# - 4 abdominal channels, 1000 Hz, 1-minute duration
# - Fetal QRS annotations in .fqrs (crowd-sourced, direct ECG reference)
# - No direct electrode in released data
# - Multiple recording sources — heterogeneous SNR

maternal_hr_min: 50
maternal_hr_max: 115
fetal_hr_min: 100
fetal_hr_max: 200
fetal_hr_low: 100
fetal_hr_high: 200
fetal_hr_centre: 130
ekf_fetal_hr_init: 140

# Lower WSVD thresholds to trigger cancellation on high-maternal-SNR recordings
WSVD_COMPONENT_CORR_THRESH: 0.15
WSVD_CHANNEL_R2_MIN: 0.20

# Match ADFECGDB bandpass to avoid baseline drift
BANDPASS_LOW: 5.0

# Lower PT_THRESHOLD_FACTOR to recover weak fetal beats post-subtraction
PT_THRESHOLD_FACTOR: 0.35

# Path selection & confidence
PATH_A_PREFERENCE: 1.0
CONFIDENCE_GATE_THRESHOLD: 0.30
HR_SEP_MIN_BPM: 15

# New roadmap controls for robustness and ablation
SQI_FUSION_ENABLED: true
PERIODICITY_SCORE_ENABLED: true
ADAPTIVE_FILTER_ENABLED: true
EKF_USE_RTS_DEFAULT: true
